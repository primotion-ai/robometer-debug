# @package _global_
defaults:
  - b200_base
  - _self_

model:
  base_model_id: /mnt/base_model/Qwen3.5-397B-A17B
  torch_dtype: float16
  # Torch 2.8 grouped_mm supports SM90 only; B200 is SM100.
  experts_implementation: eager
training:
  exp_name: robometer_qwen397b
  per_device_train_batch_size: 4
  learning_rate: 5.0e-6
  max_steps: 2000
  save_steps: 1000
  # Keep both scheduled training checkpoints (retention allows up to three).
  save_total_limit: 3
  # Pure FP16 parameter/gradient/AdamW storage, not automatic mixed precision.
  pure_fp16: true
  skip_anomalous_updates: true
  skip_loss_threshold: 10.0
  bf16: false
  fp16: false
  gradient_checkpointing: true
  gradient_checkpointing_backend: fsdp
