# @package _global_
defaults:
  - b200_base
  - _self_

model:
  base_model_id: /mnt/base_model/Qwen3-VL-4B-Instruct
  # FP32 parameters/AdamW with BF16 autocast; independent DDP replica per GPU.
  torch_dtype: float32
  use_unsloth: false
  attn_implementation: sdpa
  linear_attention_backend: auto
training:
  exp_name: robometer_qwen4b
  per_device_train_batch_size: 32
  learning_rate: 2.0e-5
  max_steps: 20000
  save_steps: 4000
  save_total_limit: 5
  eval_steps: 500
  custom_eval_steps: 500
  gradient_checkpointing: true
  gradient_checkpointing_backend: transformers
